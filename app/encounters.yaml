encounters:
  - id: false_stars
    title: False Stars
    category: Phenomenon
    pitch: The night sky mutates into wrong constellations, disorienting travelers and inflicting eldritch nightmares.
    genre: [cosmic, psychological]
    threat: nuisance
    prep: drop-in
    environment: [grassland, hill, mountain, desert, forest]
    premise: At night, the party notices the stars are wrong. Constellations they know are missing. Unfamiliar stars are present. The moon is in the wrong phase. Anyone who studies the sky for more than one turn feels a growing sense of vertigo.
    sections:
      - title: Explanation
        description: The sky is overcast by a faint shadow of the Far Realm – the echo of a failed summoning rite to bring a cosmic horror into the Material Plane.
      - title: Effect
        description: Navigation at night is impossible. Any character who sleeps under the stars is targeted by a hostile $spell:Dream$ and dreams of a vast, eerie void.
    checks:
      - check: DC 15 Arcana
        detail: The sky is profoundly aberrant. Something is very wrong with it.
      - check: DC 20 Survival
        detail: Diurnal animals are not asleep at night. This place interferes with sleep.
      - check: DC 25 Arcana
        detail: The sky is seen through the fading echo of an incomplete portal to the Far Realm.
    keywords: [exploration, hazard, rest]

  - id: looping_hollow
    title: Looping Hollow
    category: Location
    pitch: An eerie, silent depression in the landscape loops travelers back to its center unless they scale its edges.
    genre: [liminal]
    threat: nuisance
    prep: drop-in
    environment: [forest, grassland, hill]
    premise: The party enters a shallow depression where the air is oddly stale. No wind, no insects, no birdsong. The hollow seems to be going on forever.
    sections:
      - title: Effect
        description: The hollow is actually 4 miles across, but any character who tries to cross it finds themself back at the center. The only way out is to climb the walls.
    checks:
      - check: DC 15 Survival (after 4+ miles)
        detail: Familiar landmarks (twisted tree, outcrop), own footsteps ahead.
      - check: DC 18 Athletics
        detail: Climb the walls.
      - check: DC 23 Arcana
        detail: A minor planar fold, a very rare occurrence where space is curved.
    keywords: [exploration, puzzle, travel]

  - id: mirage
    title: Mirage
    category: Phenomenon
    pitch: A tantalizing distant sanctuary remains endlessly out of reach, coaxing weary travelers directly into dangerous terrain.
    genre: [liminal, psychological]
    threat: nuisance
    prep: drop-in
    environment: [desert, swamp, arctic]
    premise: In the distance, the party sees the silhouette of an oasis, escape portal, or something else they've been looking for. It always remains just out of reach.
    sections:
      - title: Explanation
        description: The mirage is a lure for the hazard. It might have been left by a band of bandit mages, the campaign antagonist, or the malevolence of the land itself.
      - title: Effect
        description: If pursued for 3+ turns, the mirage leads to an environmental hazard.
    checks:
      - check: $spell:Detect Magic$
        detail: Enchantment magic.
      - check: DC 15 Survival or Nature
        detail: It's a mirage. In areas where mirages are uncommon, the DC is 22.
    keywords: [exploration, hazard, trap]

  - id: pale_choir
    title: Pale Choir
    category: Phenomenon
    pitch: A grove of blind, hairless humanoids sings a beautiful, mind-infecting melody that turns victims into permanent performers.
    genre: [folk, body horror, gothic]
    threat: deadly
    prep: short
    environment: [forest, swamp]
    premise: The party hears beautiful, harmonious, inhuman singing. It comes from a grove of dead trees, where dozens of small, pale Humanoids have congregated. They are hairless, eyeless, with mouths stretched open in song. They do not move, but their heads turn to follow the party as they pass. The humanoids do not react to being attacked; they simply watch and sing.
    sections:
      - title: Effect
        description: Any character who hears the song must make a Wisdom saving throw. Fey and Elves succeed automatically. On a failure, the character is cursed without any immediately obvious effect.
      - title: Curse
        description: At the middle of the next Long Rest, the cursed characters wake from their sleep and begin to sing the same song with stretched-open mouths and empty expressions. Any character who hears the cursed characters sing repeats the save. Cursed characters don't remember singing. The song is loud enough to wake up the party and degrades the rest into a Short Rest.
      - title: Cure
        description: The curse is tied to the song. If a cursed character cannot hear the song (for example by having the Deafened condition or being within a $spell:Silence$), they automatically succeed on the saving throw and lose the curse. The curse also ends if the grove is consecrated by $spell:Hallow$ (Silence effect).
      - title: Fate
        description: If a character dies while cursed, they do not stay dead. Their body rises as one of the choir and they journey to join the grove, singing forever.
    checks:
      - check: DC 20 Religion
        detail: A desecrated site of a minor god (an Empyrean). The choir must have been the congregation who got punished for refusing to sing praises.
      - check: DC 25 Religion
        detail: Consecrating the grove would release the enthralled Humanoids.
    keywords: [exploration, curse, divine, rest, transformation]

  - id: sinister_presence
    title: Sinister Presence
    category: Phenomenon
    pitch: Distorted echoes of the party's own movements spawn an unsettling paranoia that drains their resolve.
    genre: [psychological, liminal]
    threat: nuisance
    prep: drop-in
    environment: [forest, hill, underdark, mountain]
    premise: In this region, every sound the party makes is echoed back distorted and malevolent. The characters' own footsteps make them feel like they are being followed, and they constantly feel like something is watching them.
    sections:
      - title: Effect
        description: If 1 minute passes without the party finding the source, every character is targeted by a $spell:Bane$ that lasts until the character completes a Long Rest. While affected, the character fails all Insight checks.
    checks:
      - check: DC 20 Survival or Investigation
        detail: The sound is coming from the party, just distorted.
    keywords: [exploration, curse, puzzle]

  - id: evil_twins
    title: Evil Twins
    category: NPC
    pitch: An exact duplicate party appears in the wilderness, waiting for the perfect moment to murder and replace their originals.
    genre: [psychological, gothic]
    threat: deadly
    prep: short
    environment: [forest, grassland, hill, swamp, underdark]
    premise: The party meets another party that looks exactly like them, lost in the same area. The clones have the party's memories and appear cooperative.
    sections:
      - title: Explanation
        description: The clones are physical avatars of survival greed, made manifest by a dark leyline that crosses the land.
      - title: Effect
        description: If joined, the clones turn on the characters at the next encounter or attack them while resting. In combat, each clone uses the $monster:Ghoul$ statistics, except it is a Fey.
    checks:
      - check: DC 15 Arcana or Nature
        detail: Presence of a leyline. Can cause strange manifestations.
      - check: DC 20 Perception or Insight
        detail: Subtle malevolence about the clones' appearance or behavior.
      - check: DC 25 Arcana or Nature
        detail: The leyline is tainted and the clones are manifestations of survival greed. They will betray the party.
    keywords: [social, combat, doppelganger, fey, trap]

  - id: crooked_idol
    title: Crooked Idol
    category: Object
    pitch: A faceless wooden shrine demands a personal sacrifice from passersby or inflicts a debilitating, sleepless curse.
    genre: [folk, melancholic]
    threat: nuisance
    prep: drop-in
    environment: [forest, hill, mountain, swamp]
    premise: "In a clearing or along a ridge, the party finds a small shrine, crudely carved from black wood, depicting a figure with too many arms and no face. Offerings surround it: withered flowers, small bones, a child's toy, a lock of hair, a silver coin. The idol radiates a sense of patient need."
    sections:
      - title: Effect
        description: Any character who passes within 10 feet of the idol and then departs without leaving an offering must make a Charisma saving throw. They automatically fail if they remove any of the existing offerings from the shrine. On a failure, the character is cursed by an angry deity.
      - title: Curse
        description: The character is plagued by a persistent feeling of being watched. Food and water tastes like ash in their mouth, and sleep brings only nightmares of the faceless figure. They are too restless to benefit from Short Rests.
      - title: Cure
        description: The curse can be cured by a spell that dispels possession or curses using a level 5+ spell slot, or if the character returns to the idol and leaves an offering of personal significance of the player's choice. The idol disregards meaningless offerings.
      - title: Blessing
        description: If a character leaves an offering the very first time they approach the idol, they receive a Charm of Restoration.
    checks:
      - check: DC 15 Investigation
        detail: The offerings are mostly sentimental.
      - check: DC 20 Religion
        detail: A minor folk god. Such gods do not ask for much, only that you do not ignore them, and that you are willing to part with what you have.
      - check: DC 20 Arcana
        detail: The magic is tied to the place itself, not the idol. Breaking the idol would anger whoever built it, and the curse would remain until the offering is made anyway.
    keywords: [exploration, divine, curse, reward, rest, healing]

