  - id: cursed_oasis
    title: Cursed Oasis
    category: Location
    pitch: A lush grove offers $spell:Goodberry$ fruits that addict the eater.
    genre: [folk, liminal]
    threat: nuisance
    prep: drop-in
    environment: [desert, swamp, mountain, underdark]
    premise: The party finds a colorful, bountiful oasis in an otherwise hostile environment, such as a desert, deadwood, or a poisonous bog. There are lush bushes, laden trees, or mushroom clusters with plump, aromatic fruits.
    sections:
      - title: Effect
        description: The fruits have the properties of a $spell:Goodberry$. Once picked, the fruits spoil after 1 day.
      - title: Curse
        description: A creature that consumes a fruit becomes cursed and craves the oasis fruits whenever it's hungry. It can't gain nourishment from any other food.
      - title: Cure
        description: $spell:Remove Curse$ or $spell:Greater Restoration$.
    checks:
      - check: Ability to cast $spell:Goodberry$
        detail: The fruit is a $spell:Goodberry$.
      - check: DC 15 Survival
        detail: The fruit is unnaturally free of blemishes and avoided by insects.
      - check: $spell:Detect Magic$ or DC 20 Arcana
        detail: Enchantment magic.
    keywords: [exploration, food, curse, healing, reward]

  - id: styx_spring
    title: Styx Spring
    category: Location
    pitch: A spring that quenches thirst and hunger, but steals memories.
    genre: [melancholic, gothic]
    threat: nuisance
    prep: drop-in
    environment: [underdark, swamp, mountain]
    premise: The party finds a strange, murky stream that disappears underground after a few hundred feet.
    sections:
      - title: Effect
        description: A character that wades into or drinks from the water must make a Wisdom saving throw. On a failure, the character automatically succeeds on future saves against this stream's water, but permanently forgets one meaningful memory of the player's choice, and their Intelligence, Wisdom, and Charisma scores decrease by 1d4 each until the end of a Long Rest. The water provides enough hydration and nutrition for 1 day.
    notes: This encounter should be used when the party or someone with them desperately needs food or water.
    checks:
      - check: DC 15 Survival or Nature
        detail: It is illogical for a stream to exist at this location – it must be supernatural.
      - check: DC 20 Arcana or Religion
        detail: The stream is a minor tributary of Styx.
      - check: DC 20 Perception
        detail: A very faint, foul odor is coming from the water.
    keywords: [exploration, planar, food, curse, reward]

  - id: whispering_cairn
    title: Whispering Cairn
    category: Object
    pitch: A mysterious stone heap repeatedly manifests in the wilderness to whisper stone-bound prophecies.
    genre: [liminal]
    threat: safe
    prep: drop-in
    environment: [grassland, hill, mountain, desert]
    premise: If a character succeeds on a Perception check while outdoors, they spot a cairn of weathered stones, sitting somewhere out of the way. The exact same cairn appears in three different locations, always after a successful Perception check that looks for something else.
    sections:
      - title: Effect
        description: Up close, the cairn whispers barely intelligible prophecies. If a character tries to find out a particular answer, the cairn casts $spell:Augury$ and answers with 'Weal,' supernaturally altering the future.
      - title: Aftermath
        description: If the cairn is knocked loose, it becomes mundane and its unfulfilled prophecies are cancelled. Otherwise, it stops appearing after the third time.
    checks:
      - check: $spell:Detect Magic$
        detail: Divination magic.
      - check: DC 15 Arcana
        detail: The whispers are prophecies. A careful listener can learn something from them.
      - check: DC 25 Religion
        detail: Sometimes a prophet who perishes prematurely leaves a trace of their gift, drawn to those who relentlessly seek the truth.
    keywords: [exploration, reward, recurring, divine, time]

  - id: fountain_of_youth
    title: Fountain of Youth
    category: Object
    pitch: A silent basin grants eternal youth and immortality, secretly converting whoever drinks into the living dead.
    genre: [body horror, gothic]
    threat: nuisance
    prep: quest
    environment: [underdark, forest, mountain, urban]
    premise: This circular basin of smooth, pale stone holds crystal clear water that glimmers like diamonds. The water cascades continuously over the rim into the pool below and feels ethereal to the touch. It makes absolutely no sound.
    sections:
      - title: Effect
        description: A creature that drinks the water is de-aged to its youthful prime if older, and permanently ceases aging. Its creature type becomes Undead. Creatures that don't age are unaffected. The water loses its properties if removed from the basin and does not provide hydration.
      - title: Cure
        description: $spell:True Resurrection$ or $spell:Wish$.
    notes: The fountain of youth is a legendary, potent object. Don't just randomly place it somewhere.
    checks:
      - check: $spell:Detect Magic$
        detail: Strong Necromancy aura on the basin water, disappears when the water is taken out.
      - check: DC 15 Survival
        detail: The water doesn't hydrate, because splashing it doesn't make things wet.
      - check: DC 20 Arcana
        detail: A very complex life-altering magic.
      - check: $spell:Legend Lore$ or DC 22 History
        detail: Identifies the fountain and its properties.
    keywords: [exploration, artifact, undead, transformation, legendary]

  - id: hungering_grave
    title: Hungering Grave
    category: Location
    pitch: An open tomb pulls nearby creatures toward its maw to entomb them alive within the Shadowfell.
    genre: [gothic]
    threat: deadly
    prep: short
    environment: [swamp, underdark, grassland, hill]
    premise: An open grave, tomb, or crypt awakens with unnatural hunger for life. The area within 60 feet around it becomes difficult terrain, and any character that enters the area for the first time on a turn or starts their turn there must make a Strength saving throw. On a failed save, the character is forcibly dragged 30 feet towards the grave.
    sections:
      - title: Effect
        description: If a character enters the grave, the grave entombs them and its plaque acquires the character's name, birth year, and the current year as the year of death. The grave then becomes mundane.
      - title: Fate
        description: The entombed character doesn't die, but is transported to the Shadowfell's reflection of the grave, where they remain in a state of suspended animation until unburied from that side. They cannot be dug out from the Material Plane.
    checks:
      - check: DC 20 Religion or Arcana
        detail: Shadowfell connection.
    keywords: [exploration, quest, hazard, undead, trap, party split, planar]

  - id: empty_tavern
    title: Empty Tavern
    category: Location
    pitch: A fully lit, steaming feast awaits in an unpopulated tavern that vanishes the moment players turn away.
    genre: [liminal, melancholic]
    threat: safe
    prep: drop-in
    environment: [grassland, forest, hill, mountain]
    premise: The party stumbles upon a roadside tavern that is lit and warm, with smoke curling up from the chimney. The tables inside are set for a feast, with platters of roasted game, bowls of stew, loaves of crusty bread, wheels of cheese, and flagons of ale. The food is hot, as if just served. The tavern, however, is completely empty.
    sections:
      - title: Effect
        description: The feast has the properties of a $spell:Heroes' Feast$. It's not cursed or poisoned.
      - title: Persistence
        description: The tavern disappears if the party loses line of sight to it.
    checks:
      - check: $spell:Detect Magic$
        detail: Conjuration everywhere.
      - check: DC 15 Investigation (after 1+ minutes)
        detail: The food is not cooling, nor is the fireplace consuming the logs.
      - check: DC 21 Arcana, or ability to cast $spell:Heroes' Feast$
        detail: The food is a $spell:Heroes' Feast$.
      - check: DC 20 Perception
        detail: Everything is pristine. No dust, cobwebs, or any wear and tear. It's like the building just appeared.
      - check: DC 25 Religion
        detail: Some gods of hospitality are known to intervene in such manner to help weary travellers. They don't require anything in return, only faith and trust.
    keywords: [exploration, sanctuary, food, divine, reward]

  - id: silent_clock_tower
    title: Silent Clock Tower
    category: Location
    pitch: A town's indestructible clock tower sits in forced silence to contain a catastrophic death-curse.
    genre: [gothic]
    threat: deadly
    prep: quest
    environment: [urban]
    premise: The town's clock tower never announces the time. The belfry is completely silent. Townsfolk don't know why, and they have been unable to repair or replace it. They say the tower is indestructible.
    sections:
      - title: Explanation
        description: The tower's bell is cursed with death magic. Many generations ago, townsfolk hired adventurers to deal with the curse, and the adventurers used $spell:Hallow$ (Silence) to mute the bell. The curse still lingers, but is contained. The truth has since been lost to time and many inaccurate legends have taken its place.
      - title: Resolution
        description: The curse is too powerful to lift. If the $spell:Hallow$ is dispelled, the bell starts to announce the time once more, but every ring of the bell casts $spell:Toll the Dead$ (level 11) on everyone in the town square.
    checks:
      - check: $spell:Detect Magic$
        detail: Abjuration, Necromancy, and Transmutation.
      - check: Level 9+ Cleric, or ability to cast $spell:Hallow$
        detail: The belfry is consecrated.
      - check: Entering the belfry
        detail: The silence affects everything, not just the bell.
      - check: DC 15 History
        detail: The tower is ancient. It must have been around for many generations.
      - check: DC 15 Perception
        detail: The tower is extremely well-preserved. Much better than all other buildings.
      - check: DC 22 Arcana (12 if $spell:Detect Magic$ was used)
        detail: The tower is cursed, but the curse is dormant. Undoing the protective ward will unleash the curse's full power.
    keywords: [exploration, quest, town, curse, puzzle]

  - id: lost_door
    title: Lost Door
    category: Object
    pitch: A standalone door in the wild leads to a cozy extraplanar haven that teleports visitors anywhere they can visualize.
    genre: [liminal, cosmic]
    threat: safe
    prep: short
    environment: [forest, grassland, hill, mountain, underdark, desert]
    premise: The party finds a perfectly ordinary hinged door standing alone in the wilderness – no walls, no frame, just a wooden door with a tarnished brass handle. It stands slightly ajar. Through the gap, the characters can see a cozy, warm interior the size of a large tavern room.
    sections:
      - title: Effect
        description: When one opens the door to leave the room, they can step out of any hinged door they can clearly picture in their mind, regardless of its location. Closing the Lost Door strands anybody on the outside, as the other door reverts to its normal exit.
      - title: Persistence
        description: The room can't be damaged or exited through a window. Any of the original room objects carried outside teleports back in when the Lost Door is closed.
      - title: Room Key
        description: Somewhere in the universe, there exists a Key that temporarily turns whatever hinged door it is inserted in into the Lost Door. This is the only way to re-enter the room if the door is closed from the outside. However, using the Key resets the room to its initial empty state, and everything else in the room is shunted into the Deep Ethereal. The Key is an artifact that is highly sought after by powerful entities.
    checks:
      - check: DC 15 History
        detail: The door and room are both archaic.
      - check: DC 20 Arcana
        detail: There must be a Key that goes with the door.
    keywords: [exploration, portal, artifact, sanctuary, travel, planar]

  - id: unmarked_grave
    title: Unmarked Grave
    category: Location
    pitch: Unearthing a fresh grave reveals a corpse of oneself holding valuable treasure, setting off a consciousness-stealing swap.
    genre: [psychological, body horror, gothic]
    threat: deadly
    prep: short
    environment: [forest, grassland, hill, swamp]
    premise: The party finds a fresh grave with no marker or stone. The dirt is loose, as if recently dug. A shovel lies nearby, still caked with soil. Unearthing the grave reveals a coffin, housing a perfectly preserved body that looks exactly like the character who dug it. The body's hands are folded over its chest, holding a small object. The object is worth 5,000 gp.
    sections:
      - title: Explanation
        description: The grave is a wound that opens when a character is failing to bury their darker nature. The coffin, the soil, the shovel are all manifestations of that struggle. The grave appears along the party's path during a tense moment of conflict. Inside the grave is the person the character might have been if they had given in to every dark impulse. The object it holds is a symbolic representation of these buried traits.
      - title: Effect
        description: If the corpse's lookalike touches the object, they must make a Wisdom saving throw. On a failure, they take the object and invisibly swap consciousness with the clone. The character's consciousness now exists inside the buried body, in a state of suspended animation. The entity from the coffin assumes the character's place. Nobody else is the wiser.
      - title: The Clone
        description: The entity from the grave has all the character's memories and abilities, but displays repressed traits. It is cruel where the character was kind, silent where the character was talkative, hungry where the character was content. It doesn't understand why its behavior is alienating the party. Eventually it lashes out in a fit of rage and despair, having briefly tasted life only to have been met with rejection.
      - title: Cure
        description: The character remains in the coffin until the clone dies or the object is returned. The clone can be controlled by the player until the DM decides it attacks the party (using the $monster:Revenant$ statistics). If the clone is killed, the character awakens in the coffin and must dig their way out. If the object is returned to the coffin, the swap reverses. The clone returns to being a corpse, and the character is freed. Destroying the object itself does nothing.
    checks:
      - check: DC 13 Survival
        detail: The freshly turned earth is loose, but there are no footprints leading to or from the grave.
      - check: DC 15 History or Religion
        detail: An unmarked grave like that is not made to remember somebody, but to forget.
      - check: DC 20 Insight
        detail: The corpse's expression is not peaceful. The lips are pulled back just slightly, the fingers curled as if ready to grasp.
    keywords: [exploration, combat, doppelganger, curse, treasure, party split]

  - id: reversed_crossing
    title: Reversed Crossing
    category: Location
    pitch: A natural archway reveals inverted time on the other side and propels travelers twelve hours into the future.
    genre: [liminal, folk]
    threat: safe
    prep: drop-in
    environment: [forest, hill, mountain]
    premise: The party encounters a natural arch with a bizarre property. Looking through the arch, the time of day appears to be reversed – noon into midnight, dusk into dawn.
    sections:
      - title: Effect
        description: The arch is a one-way portal that leads exactly 12 hours into the future. There is no way to go back to the past after passing through it – the arch becomes completely inert.
    checks:
      - check: DC 15 Investigation or Survival (during dawn/dusk)
        detail: The shadows on the other side point in the wrong direction.
      - check: DC 22 Arcana (15 if Fey)
        detail: A very rare double fey crossing.
    keywords: [exploration, portal, time, fey]

  - id: stuck_memory
    title: Stuck Memory
    category: Phenomenon
    pitch: The party steps into an isolated, looping echo of a long-forgotten memory populated by scripted inhabitants.
    genre: [liminal, melancholic, psychological]
    threat: safe
    prep: drop-in
    environment: [any]
    premise: The party encounters an out-of-place setting, such as a house that doesn't belong, a feast in the middle of nowhere, or a toll booth without a road. No one else sees it. The NPCs there exhibit exaggerated, theatrical behaviour with little variance or depth.
    sections:
      - title: Explanation
        description: This place is a fragment of a long-forgotten memory stuck in time and scattered in the multiverse. The party may encounter the exact same place again in different locations, and the NPCs will repeat the same script and not remember them on subsequent visits.
    checks:
      - check: DC 15 History
        detail: The archaic nature of the location and its denizens' accents and mannerisms.
      - check: DC 25 Arcana
        detail: It's a lost memory that has acquired substance. Odd, but harmless.
    keywords: [exploration, social, recurring]

  - id: black_lake
    title: Black Lake
    category: Location
    pitch: A pitch-black lake mirrors the viewer's drowned corpse, animating it as a Wight to drag them into the depths.
    genre: [gothic, body horror]
    threat: deadly
    prep: short
    environment: [swamp, underdark, forest]
    premise: The party must cross a lake of perfectly still, black water that reflects nothing. If a character looks into the water, they see their own corpse at the bottom, beckoning them.
    sections:
      - title: Effect
        description: Touching the lake while looking at it forces a character to make a Charisma saving throw. On a failed save, their corpse animates as a $monster:Wight$ and rises from the lake to drag the character into the frigid water. The character has the Grappled condition from the $monster:Wight$ and is Charmed while Grappled by it. If the character dies, the $monster:Wight$ disappears.
      - title: Resolution
        description: If the character breaks the grapple, they are no longer Charmed. The $monster:Wight$ becomes an inanimate corpse if defeated. The main risk is drowning.
    notes: It should be possible to bypass the lake, but this should extend the party's journey by at least 1 day.
    checks:
      - check: DC 18 History
        detail: Obscure legends mention a Black Lake where everyone drowns. It's thought that the lake is either a myth or its name is symbollic and its infamy exaggerated.
    keywords: [exploration, combat, hazard, travel, water, undead]

  - id: decomposed_barkeep
    title: Decomposed Barkeep
    category: NPC
    pitch: A rotting zombie works as a tavern barkeep, completely oblivious to its gruesome cursed appearance.
    genre: [body horror, folk]
    threat: safe
    prep: drop-in
    environment: [urban, grassland]
    premise: The barkeep in one of the village taverns looks like a $monster:Zombie$. It otherwise behaves and speaks completely ordinary. Nobody seems to notice its decayed appearance, including itself. If quizzed, they assume the party is making a pitiful attempt at humor.
    sections:
      - title: Explanation
        description: Somebody has cursed the barkeep to appear undead to outsiders.
      - title: Cure
        description: $spell:Remove Curse$ or $spell:Greater Restoration$ dispels the curse, but only outsiders can tell that anything happened.
    checks:
      - check: Creature type detection
        detail: The barkeep is Humanoid, not Undead.
      - check: DC 15 Medicine
        detail: The barkeep is breathing and has a pulse.
      - check: DC 20 Perception
        detail: The barkeep appears alive when viewed through reflective surfaces.
      - check: DC 20 Persuasion
        detail: Convince the barkeep that this is not a joke and persuade it to try to recall anything suspicious.
      - check: Necromancy subclass or DC 20 Religion
        detail: The barkeep can't be undead.
    keywords: [social, curse, town, undead]

  - id: eternal_rest
    title: Eternal Rest
    category: Phenomenon
    pitch: A peaceful resting ground cures fatigue but slowly turns exhausted travelers into permanent stone statues.
    genre: [body horror, liminal, melancholic]
    threat: deadly
    prep: drop-in
    environment: [grassland, hill, mountain, desert]
    premise: This region is sparsely littered with Petrified bodies, all sitting or lying on the ground. Any character who has Exhaustion levels soon begins to feel an urge to sit down and rest. If a character sits down, their worries and fatigue instantly begin waning.
    sections:
      - title: Effect
        description: A character that finishes a Short Rest in this area loses 1 Exhaustion level. At the end of each hour spent resting, a character is targeted by $spell:Flesh to Stone$ (environment DC).
    checks:
      - check: Observation
        detail: The Petrified bodies all appear to be sleeping or resting.
      - check: $spell:Detect Magic$
        detail: Transmutation.
      - check: DC 10 Medicine
        detail: No signs of struggle. They willingly accepted their fate.
      - check: DC 15 Arcana
        detail: The magic is two-pronged. It removes fatigue and petrifies. The petrifying part is weaker.
    keywords: [exploration, hazard, petrification, rest, trap]

  - id: jester
    title: Jester
    category: NPC
    pitch: A demented celestial performer demands an audience, granting un-twisted Wishes or slaughtering critics with magic couplets.
    genre: [gothic, psychological]
    threat: deadly
    prep: short
    environment: [forest, grassland, hill, underdark, desert]
    premise: A pale, exuberantly dressed jester (Celestial $monster:Performer Legend$, Lawful Evil) with a creepy smile and bejewelled cane is cackling and performing for a nonexistent audience deep in the wilderness. If the jester notices the party, it starts performing for them.
    sections:
      - title: Performance
        description: The jester's jokes are cruel and macabre. It performs gory magic tricks, savagely belittles the party, and mocks intimate details of their lives. If the party attempt to flee, it teleports to intercept them and force them to keep watching.
      - title: Engagement
        description: If the party pretends to enjoy the performance or responds with malicious jabs of their own (after 10+ minutes), the jester is ecstatic and rewards the party by fulfilling a $spell:Wish$. The wish is not twisted, but carries a darkly humorous side effect – for example, if characters wish to resurrect somebody, they may be reborn with an unsettling smile stuck on their face; a treasure may be made of dangerously sharp gemstones, and so on.
      - title: Hostility
        description: "If the party makes a threatening move, the jester immediately attacks the party with practical jokes. It can cast $spell:Wish$ at will, but only by wording it as a couplet. For example, a $spell:Firestorm$ rhyme might be: 'No water in which to dive, now you're gonna BURN ALIVE! AHAHAHA!'. The effects of this $spell:Wish$ are limited to duplicating other spells as level 8 slots, but the jester is creative and cruel. If the jester becomes Bloodied, it stops fighting and offers to fulfil a $spell:Wish$ as usual."
      - title: Last Laugh
        description: After the party is granted the $spell:Wish$ (or they refuse to accept it), the jester performs one last joke and disappears in a burst of gore, continuing its eternal performance elsewhere in the multiverse.
    notes: Prepare a few dangerous spells and couplets in advance, or improvise with nonsense words. Roleplay the jester as theatric, dramatic, larger-than-life, and don't be afraid to use painfully unfunny jokes.
    checks:
      - check: DC 20 Stealth
        detail: Sneak past the jester unnoticed.
      - check: DC 20 Insight
        detail: The jester expects applause or participation.
      - check: DC 23 Insight
        detail: The jester and its wishes are sincere.
      - check: DC 23 Performance
        detail: Impress the jester.
      - check: Vestige patron or DC 25 Religion
        detail: The jester is the vestige of a half-forgotten god of comedy and drama. Millennia of obscurity and isolation have rendered it demented and cruel.
    keywords: [social, combat, divine, wish, reward]

  - id: lone_tree
    title: Lone Tree
    category: Location
    pitch: In a dead, withered orchard, a single lush tree thrives under the secret care of an absent druid.
    genre: [folk, melancholic]
    threat: safe
    prep: drop-in
    environment: [forest, grassland, hill]
    premise: The party enters a blighted orchard with dead, gnarled trees. One tree amongst them is lush and green, heavy with ripe fruit.
    sections:
      - title: Effect
        description: The tree is mundane, but the fruit is delicious and regrows quickly.
      - title: Explanation
        description: An unknown druid sentimentally tends only to this particular tree by casting a confined $spell:Plant Growth$ on it every year.
    checks:
      - check: $spell:Detect Magic$
        detail: Tree is mundane.
      - check: DC 15 Nature, or ability to cast $spell:Plant Growth$
        detail: The soil under the tree has been supernaturally enriched.
    keywords: [exploration, food]

  - id: severed_shadows
    title: Severed Shadows
    category: Phenomenon
    pitch: Gloom causes player shadows to detach and become invulnerable dark monsters unless exposed to pitch darkness.
    genre: [psychological, gothic]
    threat: deadly
    prep: drop-in
    environment: [underdark, forest, swamp]
    premise: In this gloom, the characters' shadows take on a subtly aberrant, sinister bent – they may appear slightly detached, have eyes, or not perfectly mimic movements. If the characters spend 1 minute in bright or dim light, their shadows detach and emerge as hostile $monster:Shadows$ attacking the party.
    sections:
      - title: Effect
        description: These animated $monster:Shadows$ are immune to all damage and conditions, but wink out of existence while in darkness, and rejoin the characters as their regular, mundane shadows if the party leaves the area.
      - title: Resolution
        description: The shadows can't be fought, only made to disappear by darkness.
    checks:
      - check: DC 13 Perception
        detail: The shadows are unnatural.
      - check: Combat Observation
        detail: The animated $monster:Shadows$ are invulnerable – weapons and spells pass through them.
      - check: Tactical Insight (after a few rounds)
        detail: The party should realize the $monster:Shadows$ would disappear in darkness, if they haven't already.
    keywords: [combat, undead, puzzle]

  - id: wizard_ghost
    title: Wizard Ghost
    category: NPC
    pitch: A desperate dwarf ghost offers priceless secret lore in exchange for a vital spark of life energy.
    genre: [gothic, melancholic]
    threat: nuisance
    prep: short
    environment: [underdark, urban, hill, mountain]
    premise: The ghostly form of a long-dead dwarf wizard (Neutral Evil $monster:Mage$) lingers nearby. The wizard is desperately trying to $spell:Plane Shift$ into an Outer Plane but lacks the means. It is aware it is dead and trapped. It offers the party rare and useful Arcana knowledge about something they need in exchange for a spark of lifeforce to power its escape.
    sections:
      - title: Effect
        description: The wizard is lying and knows the spell won't work that way. If a character agrees to help, they take half of their maximum Hit Points as Necrotic damage and gain 1 Exhaustion level. The wizard becomes corporeal and bids the fools farewell before casting $spell:Invisibility$ on itself. The knowledge it shares, however, is genuine.
    checks:
      - check: Ability to cast $spell:Plane Shift$, or a difficult Arcana
        detail: What the wizard is trying to do is impossible.
      - check: DC 25 Charisma
        detail: Convince the wizard to give the knowledge first.
      - check: DC 25 Insight
        detail: The wizard is lying about its intentions, but its knowledge is genuine.
    keywords: [social, undead, deal, deception, reward, knowledge]

  - id: devils_bargain
    title: Devil's Bargain
    category: NPC
    pitch: A generous treasure hoard binds looters to an implicit infernal contract.
    genre: [gothic, psychological]
    threat: nuisance
    prep: quest
    environment: [any]
    premise: The party finds an unusually large treasure after an easy encounter – at least 5,000 gp worth of gems and coins. The treasure is laced with subtle divination magic.
    sections:
      - title: Effect
        description: If the party loots the treasure, a devil becomes aware of their presence. The devil considers the treasure an advance payment for a task. By taking it, the party has implicitly agreed.
      - title: The Devil
        description: 'Next time the party rests, the devil appears to meet them. It explains the deal: the treasure was payment for a task. The devil promises the second half of the treasure upon completion. The promise is genuine.'
        examples:
          - Retrieve a lock of hair from a particular person
          - Swap a temple's holy relic with a provided copy
          - Draw a sigil with lamb's blood on somebody's door
      - title: Refusal
        description: If the party refuses the task but returns the treasure along with "administrative expenses", the devil accepts, vanishes, and does not trouble them again. If the party refuses the task without returning the treasure, or attacks the devil, it vanishes. If the party ever leaves their belongings unattended, the devil robs them of every single coin, gem and precious metal they possess until it reclaims what it's owed. It's not interested in gear or magic items, only in treasure.
    notes: The task should be mysterious but creepy. The devil prefers not to elaborate and downplays it if pressed for details. The devil is always polite, friendly and pleasant, even if met with hostility.
    checks:
      - check: $spell:Detect Magic$
        detail: The treasure is laced with subtle divination magic.
      - check: DC 15 Religion or DC 20 Insight
        detail: The devil will honor the deal.
    keywords: [social, infernal, quest, treasure, deal, reward]
